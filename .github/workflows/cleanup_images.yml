name: Clean Images and Test CLI

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Unikraft CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /etc/apt/keyrings/unikraft-cli.gpg \
            https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli

      - name: Clean Account A Images
        env:
          TOKEN: ${{ secrets.UNIKRAFT_TOKEN_A }}
        run: |
          echo "$TOKEN" | unikraft login --token -
          echo "=== Account A Images Before ==="
          unikraft images list || true

          for target in xiaojieyu/myvless xiaojieyu/unikraft-fra xiaojieyu/unikraft-sfo xiaojieyu/vless xiaojieyu/x-tunnel; do
            echo "Deleting $target..."
            unikraft images remove "$target" || true
          done

          echo "=== Account A Images After ==="
          unikraft images list || true
