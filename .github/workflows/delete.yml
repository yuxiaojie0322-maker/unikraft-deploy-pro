name: Delete Unikraft Instance

on:
  workflow_dispatch:
    inputs:
      account:
        description: "选择管理的 Unikraft 账号"
        required: true
        type: choice
        default: "A - 账号 A (UNIKRAFT_TOKEN_A)"
        options:
          - "A - 账号 A (UNIKRAFT_TOKEN_A)"
          - "B - 账号 B (UNIKRAFT_TOKEN_B)"
          - "C - 账号 C (UNIKRAFT_TOKEN_C)"
          - "default - 默认账号 (UNIKRAFT_TOKEN)"
      metro:
        description: "部署地区"
        required: true
        type: choice
        default: "sin - 新加坡 (Singapore)"
        options:
          - "sin - 新加坡 (Singapore)"
          - "sfo - 旧金山 (San Francisco, US)"
          - "fra - 法兰克福 (Frankfurt, DE)"
          - "was - 华盛顿 (Washington DC, US)"
          - "dal - 达拉斯 (Dallas, US)"
      instance:
        description: "实例名称或 UUID（删除全部时可不填）"
        required: false
        type: string
      delete_all:
        description: "删除该地区全部实例（危险操作）"
        required: true
        type: boolean
        default: false

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /etc/apt/keyrings/unikraft-cli.gpg \
            https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli
          unikraft version

      - name: Select Unikraft Token & Login
        id: auth
        env:
          ACCOUNT_CHOICE: ${{ inputs.account }}
          TOKEN_A: ${{ secrets.UNIKRAFT_TOKEN_A }}
          TOKEN_B: ${{ secrets.UNIKRAFT_TOKEN_B }}
          TOKEN_C: ${{ secrets.UNIKRAFT_TOKEN_C }}
          TOKEN_DEFAULT: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_TOKEN=""
          ACCOUNT_LABEL=""

          if [[ "$ACCOUNT_CHOICE" == *"A"* && -n "$TOKEN_A" ]]; then
            TARGET_TOKEN="$TOKEN_A"
            ACCOUNT_LABEL="账号 A"
          elif [[ "$ACCOUNT_CHOICE" == *"B"* && -n "$TOKEN_B" ]]; then
            TARGET_TOKEN="$TOKEN_B"
            ACCOUNT_LABEL="账号 B"
          elif [[ "$ACCOUNT_CHOICE" == *"C"* && -n "$TOKEN_C" ]]; then
            TARGET_TOKEN="$TOKEN_C"
            ACCOUNT_LABEL="账号 C"
          elif [[ -n "$TOKEN_DEFAULT" ]]; then
            TARGET_TOKEN="$TOKEN_DEFAULT"
            ACCOUNT_LABEL="默认账号"
          fi

          if [[ -z "$TARGET_TOKEN" ]]; then
            echo "错误: 未找到对应的 Unikraft Token。" >&2
            exit 1
          fi

          echo "正在登录: ${ACCOUNT_LABEL}..."
          echo "$TARGET_TOKEN" | unikraft login --token -
          echo "account_label=${ACCOUNT_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Delete instance(s)
        env:
          METRO: ${{ inputs.metro }}
          INSTANCE: ${{ inputs.instance }}
          DELETE_ALL: ${{ inputs.delete_all }}
          ACCOUNT_LABEL: ${{ steps.auth.outputs.account_label }}
        run: |
          set -euo pipefail
          METRO_CODE="${METRO%% *}"

          echo "当前账号 ${ACCOUNT_LABEL}，列出 ${METRO_CODE} 地区的所有实例："
          unikraft instances list --filter "metro==${METRO_CODE}" -o table || true
          echo ""

          if [[ "${DELETE_ALL}" == "true" ]]; then
            echo "正在删除 ${ACCOUNT_LABEL} 在 ${METRO_CODE} 地区的所有实例..."
            unikraft instances delete --filter "metro==${METRO_CODE}" --force
            {
              echo "### 删除完成 - ${ACCOUNT_LABEL}"
              echo ""
              echo "- **地区**: \`${METRO_CODE}\`"
              echo "- **范围**: 该地区全部实例"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "${INSTANCE}" ]]; then
            echo "instance is required when delete_all is false." >&2
            echo "Fill the instance name/UUID, or enable delete_all." >&2
            exit 1
          fi

          echo "正在删除实例: ${INSTANCE}"
          unikraft instances delete "${INSTANCE}" --force
          {
            echo "### 删除完成 - ${ACCOUNT_LABEL}"
            echo ""
            echo "- **地区**: \`${METRO_CODE}\`"
            echo "- **实例**: \`${INSTANCE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
