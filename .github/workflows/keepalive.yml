name: Keep Alive Ping

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all instances
        run: |
          DOMAINS=(
            "still-brook-8p1vfpw6.sin.unikraft.app"
            "delicate-orangutan-qilpz4ph.sfo.unikraft.app"
            "green-waterfall-5j2wyo0i.sin.unikraft.app"
            "wild-snowflake-mfmwsmsh.fra.unikraft.app"
            "bold-dream-dec6k5rl.was.unikraft.app"
            "late-sunset-ya26599j.dal.unikraft.app"
          )
          for d in "${DOMAINS[@]}"; do
            echo -n "Pinging $d: "
            curl -s -m 5 -o /dev/null -w "%{http_code}\n" "https://$d" || echo "FAIL"
          done
